<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "Young Serif"; src: url(fonts/young-serif-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "Atkinson Next"; src: url(fonts/atkinson-hyperlegible-next-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
      @font-face { font-family: "Atkinson Next"; src: url(fonts/atkinson-hyperlegible-next-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
      :root { --ink: #F0EBF8; --dim: #B6AED3; --lamp: #F4CB6E; --line: #3A3366; --cool: #8FD9CB; --dawn: #F7BC9F; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B0918; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--ink); font-family: "Atkinson Next", sans-serif;
        background: linear-gradient(180deg, #2E2457 0%, #15112B 45%, #0B0918 78%, #2A1E3A 100%); }
      .clip { position: absolute; inset: 0; }
      #glow { position: absolute; left: 0; right: 0; bottom: 0; height: 700px; background: radial-gradient(800px 420px at 50% 100%, rgba(247,188,159,.5), rgba(247,188,159,0) 70%); opacity: 0; }
      .top { position: absolute; left: 96px; right: 96px; top: 150px; }
      .kicker { font: 700 40px "Atkinson Next"; color: var(--lamp); }
      .exp { font: 400 92px/1.08 "Young Serif"; margin-top: 22px; }
      #chart { position: absolute; left: 96px; right: 96px; top: 640px; height: 520px; }
      .bar { position: absolute; bottom: 60px; width: 92px; border-radius: 18px; transform-origin: bottom; }
      .day { position: absolute; bottom: 0; width: 92px; text-align: center; font: 400 34px "Atkinson Next"; color: var(--dim); }
      .legend { position: absolute; left: 96px; top: 1200px; font: 400 32px "Atkinson Next"; color: var(--dim); display: flex; gap: 34px; align-items: center; }
      .legend i { display: inline-block; width: 26px; height: 26px; border-radius: 7px; margin-right: 12px; vertical-align: -3px; }
      #res { position: absolute; left: 96px; right: 96px; top: 1310px; font: 400 84px/1.12 "Young Serif"; }
      #res b { font-weight: 400; color: var(--lamp); white-space: nowrap; }
      #keep { position: absolute; left: 96px; top: 1640px; background: var(--cool); color: #0B0918; font: 700 44px "Atkinson Next"; padding: 22px 46px; border-radius: 60px; }
      .brand { position: absolute; left: 96px; bottom: 96px; font: 700 46px "Atkinson Next"; letter-spacing: -0.03em; display: flex; align-items: center; gap: 18px; }
      .brand svg { width: 58px; height: 58px; flex: none; }
      .note { position: absolute; right: 96px; bottom: 104px; font: 400 30px "Atkinson Next"; color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-fps="30" data-width="1080" data-height="1920">
      <div id="frame" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="glow"></div>
        <div class="top" id="top"><p class="kicker">My week 1 result</p><h1 class="exp">No wine after 7 PM</h1></div>
        <div id="chart"></div>
        <p class="legend" id="legend"><span><i style="background:#F4CB6E"></i>Did the test</span><span><i style="background:#3A3366"></i>Didn’t</span></p>
        <p id="res">I had <b>2 fewer wake-ups</b> on nights without wine.</p>
        <span id="keep">Keeping it</span>
        <p class="brand"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#E8A93E"/><path d="M20.5 47.5q11.5 11 23 0M56.5 47.5q11.5 11 23 0" fill="none" stroke="#22264B" stroke-width="4" stroke-linecap="round"/><circle cx="21.5" cy="66" r="6.5" fill="#E38D52"/><circle cx="78.5" cy="66" r="6.5" fill="#E38D52"/></svg>sleepthrough</p>
        <p class="note">Example week</p>
      </div>
    </div>
    <script>
      var vals = [3, 1, 1, 3, 1, 0, 1], days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'], chart = document.getElementById('chart');
      chart.innerHTML = vals.map(function (v, i) {
        var x = i * 128, h = Math.max(16, v / 3 * 420), on = v < 3;
        return '<i class="bar" style="left:' + x + 'px;height:' + h + 'px;background:' + (on ? '#F4CB6E' : '#3A3366') + '"></i><span class="day" style="left:' + x + 'px">' + days[i] + '</span>';
      }).join('');
      var tl = gsap.timeline({ paused: true });
      gsap.set('.bar', { scaleY: 0 });
      gsap.set(['#res', '#keep', '#legend'], { opacity: 0 });
      tl.from('#top', { y: 40, opacity: 0, duration: 0.8, ease: 'power3.out' }, 0.1);
      tl.from('.day', { opacity: 0, duration: 0.4, stagger: 0.05 }, 0.6);
      tl.to('.bar', { scaleY: 1, duration: 0.55, ease: 'back.out(1.4)', stagger: 0.32 }, 1.0);
      tl.to('#legend', { opacity: 1, duration: 0.5 }, 3.2);
      tl.to('#res', { opacity: 1, duration: 0.7, ease: 'power2.out' }, 3.8);
      tl.from('#res', { y: 30, duration: 0.7, ease: 'power2.out' }, 3.8);
      tl.to('#glow', { opacity: 1, duration: 1.4, ease: 'sine.inOut' }, 4.6);
      tl.to('#keep', { opacity: 1, duration: 0.3 }, 5.3);
      tl.from('#keep', { scale: 0.4, duration: 0.5, ease: 'back.out(2.4)' }, 5.3);
      tl.set({}, {}, 10);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
